<hg-page-header title="Transaction ledger" subtitle="Immutable stock movement history" />

<mat-card>
  <mat-card-content>
    <form [formGroup]="filters" class="filters">
      <mat-form-field appearance="outline">
        <mat-label>Type</mat-label>
        <mat-select formControlName="type">
          <mat-option value="">All</mat-option>
          @for (t of types; track t) { <mat-option [value]="t">{{ t }}</mat-option> }
        </mat-select>
      </mat-form-field>
    </form>

    <hg-data-state
      [loading]="loading()"
      [error]="error()"
      [empty]="!loading() && rows().length === 0"
      emptyText="No transactions."
    />

    @if (!loading() && rows().length) {
      <table mat-table [dataSource]="rows()" class="ledger-table">
        <ng-container matColumnDef="createdAtUtc">
          <th mat-header-cell *matHeaderCellDef>When</th>
          <td mat-cell *matCellDef="let t">{{ t.createdAtUtc | date: 'short' }}</td>
        </ng-container>
        <ng-container matColumnDef="medicine">
          <th mat-header-cell *matHeaderCellDef>Medicine</th>
          <td mat-cell *matCellDef="let t">{{ t.medicineName }}</td>
        </ng-container>
        <ng-container matColumnDef="phc">
          <th mat-header-cell *matHeaderCellDef>PHC</th>
          <td mat-cell *matCellDef="let t">{{ t.phcName }}</td>
        </ng-container>
        <ng-container matColumnDef="type">
          <th mat-header-cell *matHeaderCellDef>Type</th>
          <td mat-cell *matCellDef="let t"><span class="tag" [attr.data-type]="t.type">{{ t.type }}</span></td>
        </ng-container>
        <ng-container matColumnDef="quantity">
          <th mat-header-cell *matHeaderCellDef>Qty</th>
          <td mat-cell *matCellDef="let t">{{ t.quantity }}</td>
        </ng-container>
        <ng-container matColumnDef="balanceAfter">
          <th mat-header-cell *matHeaderCellDef>Balance</th>
          <td mat-cell *matCellDef="let t">{{ t.balanceAfter }}</td>
        </ng-container>
        <ng-container matColumnDef="reference">
          <th mat-header-cell *matHeaderCellDef>Reference</th>
          <td mat-cell *matCellDef="let t">{{ t.reference ?? '—' }}</td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
      <mat-paginator
        [length]="total()"
        [pageSize]="pageSize"
        [pageIndex]="page"
        [pageSizeOptions]="[10, 20, 50]"
        (page)="onPage($event)"
      />
    }
  </mat-card-content>
</mat-card>
