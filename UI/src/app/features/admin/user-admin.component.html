<hg-page-header title="Users" subtitle="Accounts, roles and district / PHC scope">
  <button mat-flat-button color="primary" (click)="open(null)">
    <mat-icon>person_add</mat-icon> New user
  </button>
</hg-page-header>

<mat-card>
  <mat-card-content>
    <hg-data-state [loading]="loading()" [empty]="!loading() && rows().length === 0" emptyText="No users." />
    @if (!loading() && rows().length) {
      <table mat-table [dataSource]="rows()" class="tbl">
        <ng-container matColumnDef="fullName">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let u">{{ u.fullName }}</td>
        </ng-container>
        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let u">{{ u.email }}</td>
        </ng-container>
        <ng-container matColumnDef="role">
          <th mat-header-cell *matHeaderCellDef>Role</th>
          <td mat-cell *matCellDef="let u"><mat-chip>{{ u.role }}</mat-chip></td>
        </ng-container>
        <ng-container matColumnDef="scope">
          <th mat-header-cell *matHeaderCellDef>Scope</th>
          <td mat-cell *matCellDef="let u">{{ scope(u) }}</td>
        </ng-container>
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let u">
            <button mat-icon-button (click)="open(u)"><mat-icon>edit</mat-icon></button>
          </td>
        </ng-container>
        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>
    }
  </mat-card-content>
</mat-card>
