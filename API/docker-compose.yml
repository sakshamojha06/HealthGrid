# Local full-stack backend. From the API/ folder: docker compose up --build
services:
  sql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Your_strong_Passw0rd"
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      retries: 10
      start_period: 30s

  ai:
    build: ./python
    environment:
      HEALTHGRID_AI_API_KEY: "local-ai-key"
    ports:
      - "8000:8000"

  api:
    build:
      context: ./csharp
      dockerfile: HealthGrid.Api/Dockerfile
    depends_on:
      sql:
        condition: service_healthy
      ai:
        condition: service_started
    environment:
      ASPNETCORE_ENVIRONMENT: "Development"
      ConnectionStrings__HealthGrid: "Server=sql,1433;Database=HealthGrid;User Id=sa;Password=Your_strong_Passw0rd;TrustServerCertificate=True;Encrypt=False"
      Jwt__SigningKey: "compose-development-signing-key-change-me-32chars"
      Ai__BaseUrl: "http://ai:8000"
      Ai__ApiKey: "local-ai-key"
      Cors__Origins__0: "http://localhost:4200"
    ports:
      - "5030:8080"
